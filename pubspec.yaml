name: analyticsbyshanikwa_app
description: "Analytics by Shanikwa — Data, Faith, Finance. One codebase, four niche builds (full / accounting / data / bible) for Windows, macOS, iOS, and Android."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  url_launcher: ^6.3.0
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  google_fonts: ^6.2.0
  # In-app purchase, for storefronts where linking out to buy is still banned
  # (UK, Canada, Australia, EU). No web implementation — every call is guarded
  # by kIsWeb. See lib/commerce/purchases.dart.
  in_app_purchase: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.0
  msix: ^3.18.0

# Microsoft Store packaging.  Build first, then package:
#   flutter build windows --dart-define=APP_NICHE=full
#   dart run msix:create                 # test-signed, for local install only
#   dart run msix:create --store         # the .msix you upload to Partner Center
#
# identity_name / publisher / publisher_display_name are copied verbatim from
# Partner Center > Product management > Product identity (2026-08-11). They must
# match character for character or the upload is rejected. Not secrets: the
# publisher CN appears in every published MSIX. Microsoft signs the Store
# package, so no purchased certificate is needed.
#
# Bump msix_version for every submission. It must increase, and the last digit
# must stay 0 - the Store reserves it.
msix_config:
  display_name: Analytics by Shanikwa
  publisher_display_name: Analytics by Shanikwa
  identity_name: AnalyticsbyShanikwa.AnalyticsbyShanikwa
  publisher: CN=82609663-1176-497C-A1B0-947A85A73EEF
  msix_version: 1.0.1.0
  logo_path: icon_src/icon_master.png
  capabilities: internetClient
  store: false

# Regenerate every platform icon with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  # Square, opaque, corners filled with brand navy. The original PNG had pure
  # black corners which would show as a black frame inside Apple's rounded mask.
  image_path: "icon_src/icon_master.png"

  android: true
  min_sdk_android: 21
  # Adaptive icons are masked to a circle/squircle and crop the outer third,
  # so the artwork sits inside a 66% safe zone on a solid navy plate.
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "icon_src/adaptive_foreground.png"

  ios: true
  # The App Store rejects icons containing an alpha channel.
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "icon_src/icon_master.png"
    background_color: "#0F172A"
    theme_color: "#0F172A"

  # windows/ was scaffolded after the icons were first generated, so it shipped
  # with Flutter's default logo. 256 is the largest size Windows uses in the
  # .ico and what shows in the Store listing and taskbar.
  windows:
    generate: true
    image_path: "icon_src/icon_master.png"
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/content/
    # Inter, bundled. google_fonts loads matching files from this folder and,
    # with allowRuntimeFetching disabled in main.dart, never contacts
    # fonts.gstatic.com. That keeps the app's only network call our own
    # content.json, and makes "works offline" true on first launch too.
    - assets/google_fonts/
    # Was "assets/freebies/content.json" — that file does not exist, and a
    # declared-but-missing asset fails the build. The code loads freebies by
    # name at runtime (rootBundle.load('assets/freebies/${bundled.file}')),
    # so the whole folder must be declared instead.
    - assets/freebies/
