name: analyticsbyshanikwa_app
description: "Analytics by Shanikwa — Data, Faith, Finance. One codebase, four niche builds (full / accounting / data / bible) for Windows, macOS, iOS, and Android."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  url_launcher: ^6.3.0
  path_provider: ^2.1.4
  open_filex: ^4.5.0
  google_fonts: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.0

# Regenerate every platform icon with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  # Square, opaque, corners filled with brand navy. The original PNG had pure
  # black corners which would show as a black frame inside Apple's rounded mask.
  image_path: "icon_src/icon_master.png"

  android: true
  min_sdk_android: 21
  # Adaptive icons are masked to a circle/squircle and crop the outer third,
  # so the artwork sits inside a 66% safe zone on a solid navy plate.
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "icon_src/adaptive_foreground.png"

  ios: true
  # The App Store rejects icons containing an alpha channel.
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "icon_src/icon_master.png"
    background_color: "#0F172A"
    theme_color: "#0F172A"

flutter:
  uses-material-design: true
  assets:
    - assets/content/
    # Was "assets/freebies/content.json" — that file does not exist, and a
    # declared-but-missing asset fails the build. The code loads freebies by
    # name at runtime (rootBundle.load('assets/freebies/${bundled.file}')),
    # so the whole folder must be declared instead.
    - assets/freebies/
